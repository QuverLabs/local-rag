# Frozen benchmark query set for local-rag.
#
# Each run of benchmarks/runner.py uses this file verbatim. Changing it
# makes past runs non-comparable, so treat it as an append-only ledger:
# add new queries only when a new class of phenomena emerges (record the
# rationale in the commit message), and avoid editing existing entries.
#
# `expected` is a list of paths relative to NOTES_DIR. A query "hits" when
# any expected path appears in the top-K. An empty list marks a nonsense
# query — the runner skips Hit/MRR and measures only top-1 score, which
# probes calibration of the `min_score` threshold.
#
# Categories:
#   A — natural domain queries with a single obvious target
#   B — natural queries that could legitimately land on several files
#   C — exact-string / numeric probes to check BM25/FTS5 health
#   D — nonsense / adversarial; we want these to score low
#   E — tricky / generic queries (stress test for robustness)

# ── A. Naturalne, jednoznaczne ────────────────────────────────────────────

[[queries]]
id = 1
category = "A"
query = "renowacja dachu bez zrywania starego pokrycia"
expected = ["uslugi/renowacja-dachu.md"]

