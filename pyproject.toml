[project]
name = "local-rag"
version = "0.1.0"
description = "Local RAG over markdown notes using sqlite-memory, exposed to Claude Desktop via MCP."
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.4",
    "python-dotenv>=1.2",
    "httpx>=0.28",
    "tqdm>=4.68.4",
]

[project.scripts]
rag-ingest = "ingest:main"
rag-server = "server:main"

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setup"]
include = ["ingest.py", "server.py"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# CurrentContext() in argument defaults is FastMCP's documented DI pattern
# (same shape as FastAPI's Depends()).
extend-immutable-calls = ["fastmcp.dependencies.CurrentContext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
