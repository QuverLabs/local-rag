[project]
name = "local-rag"
version = "0.1.0"
description = "Local RAG over markdown notes using sqlite-memory, exposed to Claude Desktop via MCP."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.scripts]
rag-ingest = "ingest:main"
rag-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setup"]
include = ["ingest.py", "server.py"]
